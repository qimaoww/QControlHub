name: qcontrolhub

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qcontrolhub}
      POSTGRES_USER: ${POSTGRES_USER:-qcontrolhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make init-env or set POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    ports:
      - "${QCH_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
      - database-host
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$$POSTGRES_PASSWORD pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  control-plane:
    image: ghcr.io/qimaoww/qcontrol-plane:${QCH_IMAGE_TAG:-latest}
    build:
      context: .
      target: qcontrol-plane
      args:
        VERSION: ${VERSION:-dev}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      QCH_DATABASE_URL: postgresql://${POSTGRES_USER:-qcontrolhub}:${POSTGRES_PASSWORD:?run make init-env or set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-qcontrolhub}?sslmode=disable
      QCH_ADMIN_TOKEN: ${QCH_ADMIN_TOKEN:?run make init-env or set QCH_ADMIN_TOKEN}
      QCH_LISTEN: 0.0.0.0:8080
      QCH_BEHIND_TLS_PROXY: ${QCH_BEHIND_TLS_PROXY:-true}
      QCH_ALLOW_INSECURE_HTTP: ${QCH_ALLOW_INSECURE_HTTP:-false}
      # PostgreSQL is on this Compose project's isolated internal bridge.
      QCH_ALLOW_INSECURE_DATABASE: ${QCH_ALLOW_INSECURE_DATABASE:-true}
      QCH_CORS_ORIGINS: ${QCH_CORS_ORIGINS:-}
      # Trust only the fixed qcontrol-web peer and the host-side Nginx gateway.
      QCH_TRUSTED_PROXY_CIDRS: ${QCH_TRUSTED_PROXY_CIDRS:-172.30.254.2/32,172.30.254.1/32}
      # Optional capabilities; all default to disabled/empty so Compose keeps
      # working without them.
      QCH_WEBHOOK_SECRET: ${QCH_WEBHOOK_SECRET:-}
      QCH_CONFIG_ENCRYPTION_KEY: ${QCH_CONFIG_ENCRYPTION_KEY:-}
      QCH_CONFIG_ENCRYPTION_PREVIOUS_KEYS: ${QCH_CONFIG_ENCRYPTION_PREVIOUS_KEYS:-}
      QCH_OPERATOR_TOKENS: ${QCH_OPERATOR_TOKENS:-}
      QCH_READONLY_TOKENS: ${QCH_READONLY_TOKENS:-}
      # Managed public-IP probes default to the family-specific ident.me
      # endpoints. Set the enable flag to false to suppress all public echo
      # egress; explicit endpoint values override one family at a time.
      QCH_AGENT_PUBLIC_IP_PROBE_ENABLED: ${QCH_AGENT_PUBLIC_IP_PROBE_ENABLED:-true}
      QCH_AGENT_PUBLIC_IP_PROBE_IPV4_ENDPOINT: ${QCH_AGENT_PUBLIC_IP_PROBE_IPV4_ENDPOINT:-}
      QCH_AGENT_PUBLIC_IP_PROBE_IPV6_ENDPOINT: ${QCH_AGENT_PUBLIC_IP_PROBE_IPV6_ENDPOINT:-}
      QCH_AGENT_PUBLIC_IP_PROBE_INTERVAL: ${QCH_AGENT_PUBLIC_IP_PROBE_INTERVAL:-5m}
    networks:
      backend:
      control-host:
        ipv4_address: ${QCH_CONTROL_PLANE_PROXY_ADDRESS:-172.30.254.3}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    stop_grace_period: 15s

  qcontrol-web:
    image: ghcr.io/qimaoww/qcontrol-web:${QCH_IMAGE_TAG:-latest}
    build:
      context: .
      target: qcontrol-web
      args:
        VERSION: ${VERSION:-dev}
    restart: unless-stopped
    depends_on:
      control-plane:
        condition: service_healthy
    ports:
      - "${QCH_BIND_ADDRESS:-127.0.0.1}:${QCH_PORT:-8080}:8080"
    networks:
      control-host:
        ipv4_address: ${QCH_WEB_PROXY_ADDRESS:-172.30.254.2}
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
      - /var/cache/nginx:size=8m,mode=1777
      - /var/run:size=1m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    stop_grace_period: 10s

volumes:
  postgres-data:

networks:
  backend:
    internal: true
  control-host:
    ipam:
      config:
        - subnet: ${QCH_CONTROL_PROXY_SUBNET:-172.30.254.0/24}
          gateway: ${QCH_CONTROL_PROXY_GATEWAY:-172.30.254.1}
  database-host:
