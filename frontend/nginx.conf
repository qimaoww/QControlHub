worker_processes auto;
user nginx;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 512; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  keepalive_timeout 65;
  gzip on;
  gzip_static on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types application/javascript application/json image/svg+xml text/css;
  resolver 127.0.0.11 ipv6=off valid=30s;
  map "$uri:$arg_v" $qcontrol_cache_control {
    default "no-store";
    ~^/assets/.*:.+$ "public, max-age=31536000, immutable";
    ~^/assets/ "no-cache, must-revalidate";
  }

  server {
    listen 8080;
    server_name _;
    set $control_plane http://control-plane:8080;
    root /usr/share/nginx/html;
    client_max_body_size 16m;

    # Cloudflare appends its web analytics beacon to HTML responses at the edge.
    # The policy below therefore names that beacon's script and report origins;
    # without them every page load reports a blocked script and a console error.
    # Traffic already passes through that edge, so this adds no reach the
    # deployment does not already grant it. Turning Web Analytics off in the
    # Cloudflare dashboard removes the script, and these two origins with it.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self'; img-src 'self' data:; connect-src 'self' https://cloudflareinsights.com; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
    add_header Cache-Control $qcontrol_cache_control always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = /healthz { default_type application/json; return 200 '{"status":"ok","service":"qcontrol-web"}'; }
    location = /install-agent.sh { proxy_pass http://control-plane:8080/api/v1/agent-installer; proxy_set_header X-QControlHub-Enrollment $http_x_qcontrolhub_enrollment; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /readyz { proxy_pass $control_plane; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /api/ { proxy_pass $control_plane; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location = /api/v1/agent-binary { proxy_pass $control_plane; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_buffering off; }
    # The Agent binary is multi-megabyte and the container's /var/cache/nginx
    # is a small tmpfs. Streaming the response avoids spooling it to the temp
    # directory, which otherwise fills up on a slow upstream read and aborts
    # the download (observed as an HTTP/2 RST_STREAM on the Agent).
    location /agent/ { proxy_http_version 1.1; proxy_buffering off; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_pass $control_plane; }
    location /assets/ { try_files $uri =404; }
    location ^~ /install-assets/ { try_files $uri =404; }
    location = / {
      absolute_redirect off;
      if ($args != "") { return 302 /; }
      try_files /index.html =404;
    }
    location / { try_files $uri $uri/ /index.html; }
  }
}
