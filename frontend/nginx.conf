worker_processes auto;
user nginx;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 512; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  keepalive_timeout 65;
  resolver 127.0.0.11 ipv6=off valid=30s;

  server {
    listen 8080;
    server_name _;
    set $control_plane http://control-plane:8080;
    root /usr/share/nginx/html;
    client_max_body_size 2m;

    location = /healthz { default_type application/json; return 200 '{"status":"ok","service":"qcontrol-web"}'; }
    location = /readyz { proxy_pass $control_plane; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /api/ { proxy_pass $control_plane; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /agent/ { proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $http_host; proxy_pass $control_plane; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
