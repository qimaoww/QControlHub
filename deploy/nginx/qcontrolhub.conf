# This file is intended to be included inside nginx's `http {}` context,
# for example as /etc/nginx/conf.d/qcontrolhub.conf.

map $uri $qcontrolhub_auth_limit_key {
    default "";
    ~^/(login|agent/v1/enroll)$ $binary_remote_addr;
}

map $http_upgrade $qcontrolhub_connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $qcontrolhub_auth_limit_key zone=qcontrolhub_auth:10m rate=10r/m;

upstream qcontrolhub_control_plane {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name qcontrolhub.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name qcontrolhub.example.com;

    ssl_certificate /etc/letsencrypt/live/qcontrolhub.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qcontrolhub.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:QControlHubTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    # The control plane accepts a 2 MiB configuration after JSON/form
    # encoding; escaping can expand the HTTP envelope beyond 12 MiB.
    client_max_body_size 16m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/qcontrolhub.access.log;
    error_log /var/log/nginx/qcontrolhub.error.log warn;

    location / {
        limit_req zone=qcontrolhub_auth burst=10 nodelay;

        proxy_pass http://qcontrolhub_control_plane;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $qcontrolhub_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout 70s;
        # The server receives JSON heartbeats but can be quiet in the upstream-to-proxy
        # direction while no task is pending, so keep WSS sessions open for one hour.
        proxy_read_timeout 3600s;
        proxy_request_buffering on;
        proxy_buffering on;
    }
}
