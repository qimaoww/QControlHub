name: Go compilation cache
description: Cache modules and objects for one OS, architecture, Go and libc combination
inputs:
  identity:
    required: true
    description: Platform and toolchain identity, including cache format version
  paths:
    required: true
    description: Module and build cache directories
runs:
  using: composite
  steps:
    # main publishes reusable objects. A PR restores those objects but avoids
    # archiving hundreds of MB again after each source-only change.
    - uses: actions/cache/restore@v6
      if: github.event_name == 'pull_request'
      with:
        path: ${{ inputs.paths }}
        key: ${{ inputs.identity }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ hashFiles('**/*.go', '!.ci-cache/**') }}
        restore-keys: |
          ${{ inputs.identity }}-${{ hashFiles('go.mod', 'go.sum') }}-
          ${{ inputs.identity }}-
    - uses: actions/cache@v6
      if: github.event_name != 'pull_request'
      with:
        path: ${{ inputs.paths }}
        key: ${{ inputs.identity }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ hashFiles('**/*.go', '!.ci-cache/**') }}
        restore-keys: |
          ${{ inputs.identity }}-${{ hashFiles('go.mod', 'go.sum') }}-
          ${{ inputs.identity }}-
