name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -buildvcs=false
  QCH_CI_REPORT_DIR: ${{ github.workspace }}/.ci-report

jobs:
  debian:
    name: Debian / systemd
    runs-on: ubuntu-latest
    container: golang:1.25-bookworm
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qcontrolhub
        options: >-
          --health-cmd "pg_isready -U postgres -d qcontrolhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GOCACHE: ${{ github.workspace }}/.ci-cache/debian-build
      GOMODCACHE: ${{ github.workspace }}/.ci-cache/debian-mod
      QCH_CI_PLATFORM: debian
      QCH_TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/qcontrolhub?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        id: debian-go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Debian Go objects and modules
        uses: ./.github/actions/go-cache
        with:
          identity: qch-v4-linux-${{ runner.arch }}-go${{ steps.debian-go.outputs.go-version }}-debian12-glibc
          paths: |
            ${{ env.GOCACHE }}
            ${{ env.GOMODCACHE }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Require a schema version bump for schema changes
        env:
          QCH_SCHEMA_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node .github/scripts/check-schema-version.mjs

      - name: Install Debian test dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          # iproute2 provides the ip binary that sing-box dual accounting uses
          # to prove existing policy routing cannot hijack outbound marks.
          # postgresql-client creates one isolated database per test shard.
          apt-get install --no-install-recommends --yes openssl iproute2 postgresql-client

      - name: Download Go modules
        run: sh .github/scripts/ci-time.sh modules go mod download

      - name: Run project checks with PostgreSQL
        env:
          QCH_TEST_SHARDS: "4"
        run: |
          bash .github/scripts/run-ci-tests.sh --checks "make non-browser-checks"

      - name: Build release binaries
        run: sh .github/scripts/ci-time.sh release-build make build VERSION="${{ github.sha }}"

      - name: Validate systemd bootstrap
        shell: bash
        run: |
          fake_bin="$(mktemp -d)"
          trap 'rm -rf "$fake_bin"' EXIT
          printf '%s\n' \
            '#!/bin/sh' \
            'case "$1" in' \
            '  is-active) exit 1 ;;' \
            '  show) printf "%s\n" not-found ;;' \
            '  *) exit 0 ;;' \
            'esac' > "$fake_bin/systemctl"
          chmod 0755 "$fake_bin/systemctl"
          PATH="$fake_bin:$PATH" QCH_SERVICE_MANAGER=systemd sh deploy/bootstrap-core-services.sh
          for service in mihomo xray sing-box shadowsocks-rust; do
            test -f "/etc/systemd/system/qagent-$service.service"
            grep -q '^Description=.* managed by QAgent$' "/etc/systemd/system/qagent-$service.service"
          done
          test -f /etc/systemd/journald@qagent-cores.conf.d/10-qcontrolhub-volatile.conf

      - name: Upload Debian timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-timings-debian
          path: .ci-report
          if-no-files-found: warn
          include-hidden-files: true

  alpine:
    name: Alpine / OpenRC
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qcontrolhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qcontrolhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Pull and identify the Alpine toolchain
        id: alpine-toolchain
        run: sh .github/scripts/container-toolchain.sh golang:1.25-alpine

      - name: Restore Alpine Go objects and modules
        uses: ./.github/actions/go-cache
        with:
          identity: qch-v4-${{ runner.os }}-${{ runner.arch }}-${{ steps.alpine-toolchain.outputs.identity }}
          paths: |
            .ci-cache/alpine-build
            .ci-cache/alpine-mod

      - name: Run project checks on musl/OpenRC
        run: |
          sh .github/scripts/run-ci-container.sh --rm --init --network host \
            -e QCH_TEST_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/qcontrolhub?sslmode=disable \
            -e QCH_TEST_SHARDS=4 \
            -e GOFLAGS=-buildvcs=false -e QCH_CI_PLATFORM=alpine \
            -e QCH_CI_REPORT_DIR=/src/.ci-report \
            -e GOCACHE=/cache/build -e GOMODCACHE=/cache/mod \
            -v "$PWD/.ci-cache/alpine-build:/cache/build" \
            -v "$PWD/.ci-cache/alpine-mod:/cache/mod" \
            -e VERSION="${{ github.sha }}" \
            -v "$PWD:/src" -w /src golang:1.25-alpine sh -euxc '
              sh .github/scripts/ci-time.sh dependencies apk add --no-cache bash coreutils findutils git libcap make nftables nodejs openrc openssl postgresql-client
              sh .github/scripts/ci-time.sh modules go mod download
              bash .github/scripts/run-ci-tests.sh \
                --checks "make alpine-non-browser-checks" \
                --exclude "/internal/agent$" \
                --extra "make alpine-agent-test" --extra-independent
              sh .github/scripts/ci-time.sh release-build make build VERSION="$VERSION"
              sh deploy/tests/existing-core-openrc.sh
              sh -n deploy/remote/install-agent.sh
              sh -n deploy/bootstrap-core-services.sh
              for service in deploy/openrc/*; do sh -n "$service"; done
              QCH_SERVICE_MANAGER=openrc sh deploy/bootstrap-core-services.sh
              for service in qagent-mihomo qagent-xray qagent-sing-box qagent-shadowsocks-rust; do
                test -x "/etc/init.d/$service"
                "/etc/init.d/$service" describe >/dev/null
                rc-update show default | grep -q "$service"
              done
            '

      - name: Upload Alpine timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-timings-alpine
          path: .ci-report
          if-no-files-found: warn
          include-hidden-files: true

  upgrade-sandbox:
    name: Agent upgrade read-only sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOMODCACHE: ${{ github.workspace }}/.ci-cache/sandbox-mod
      QCH_SANDBOX_GOCACHE: ${{ github.workspace }}/.ci-cache/sandbox-build
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Pull and identify the sandbox toolchain
        id: sandbox-toolchain
        run: sh .github/scripts/container-toolchain.sh golang:1.25-bookworm
      - name: Restore sandbox Go objects and modules
        uses: ./.github/actions/go-cache
        with:
          identity: qch-v4-${{ runner.os }}-${{ runner.arch }}-${{ steps.sandbox-toolchain.outputs.identity }}-sandbox
          paths: |
            ${{ env.GOMODCACHE }}
            ${{ env.QCH_SANDBOX_GOCACHE }}
      - run: go mod download
      - run: make upgrade-sandbox-test
      - run: make ss-rust-runtime-test

  mieru-udp:
    name: Mieru UDP over TCP / ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: v1.19.31
            sha256: d5e74bbddbdfff49a1aef7775bf5911da59f0d7196ed509a0ac914b3653dd5f1
          - version: v1.19.32
            sha256: 8451100836c9eda194331c2babfad490b2faf30cebc1a04b0e76fd8ac2d35d10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Fetch the official pinned Mihomo release
        env:
          MIHOMO_VERSION: ${{ matrix.version }}
          MIHOMO_SHA256: ${{ matrix.sha256 }}
        run: |
          core_root="$RUNNER_TEMP/mieru-core"
          mkdir -p "$core_root/bin"
          curl --fail --location --retry 3 \
            "https://github.com/MetaCubeX/mihomo/releases/download/$MIHOMO_VERSION/mihomo-linux-amd64-$MIHOMO_VERSION.gz" \
            --output "$core_root/mihomo.gz"
          printf '%s  %s\n' "$MIHOMO_SHA256" "$core_root/mihomo.gz" | sha256sum --check
          gzip -dc "$core_root/mihomo.gz" > "$core_root/bin/mihomo"
          chmod 0755 "$core_root/bin/mihomo"
          "$core_root/bin/mihomo" -v
          go version -m "$core_root/bin/mihomo"
      - name: Verify real forwarding under systemd socket policies
        run: |
          sudo sh deploy/bootstrap-core-services.sh --prepare-agent
          go test -c -o "$RUNNER_TEMP/mieru-agent.test" ./internal/agent
          cd internal/agent
          sudo env QCH_LIVE_MIERU_SYSTEMD_TEST=1 \
            QCH_LIVE_CORE_ROOT="$RUNNER_TEMP/mieru-core" \
            "$RUNNER_TEMP/mieru-agent.test" \
            -test.run '^TestMieruUDPWithSystemdSocketPolicy$' -test.count=1 -test.v

  core-permissions:
    name: All cores / actual service permissions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify fixture address readiness regressions
        run: sudo unshare --net env QCH_TEST_PERMISSION_NETNS=1 python3 -B deploy/tests/core_permission_network_test.py
      - name: Fetch verified official kernels
        run: sh deploy/tests/fetch-permission-cores.sh "$RUNNER_TEMP/permission-cores"
      - name: Verify full systemd service policies and forwarding
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes nftables
          sudo sh deploy/bootstrap-core-services.sh --prepare-agent
          sudo env QCH_PERMISSION_BIN="$RUNNER_TEMP/permission-cores/bin" \
            QCH_SERVICE_MANAGER=systemd python3 deploy/tests/core-permissions-runtime.py
      - name: Verify Alpine OpenRC policies, migration and forwarding
        run: |
          CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/permission-agent.test" ./internal/agent
          # SYS_PTRACE belongs to the fixture Agent, which verifies cross-UID
          # /proc/exe identity. Each core is still bounded to BIND_SERVICE+ADMIN.
          sh .github/scripts/run-ci-container.sh --rm --init --cap-add NET_ADMIN --cap-add SYS_PTRACE --sysctl net.ipv4.ip_unprivileged_port_start=1024 \
            -v "$PWD:/src:ro" -v "$RUNNER_TEMP/permission-cores:/official:ro" \
            -v "$RUNNER_TEMP/permission-agent.test:/permission-agent.test:ro" \
            -w /src golang:1.25-alpine sh -ec '
              apk add --no-cache python3 openrc libcap openssl coreutils nftables iproute2 >/dev/null
              python3 -B deploy/tests/core_permission_network_test.py
              QCH_SERVICE_MANAGER=openrc sh deploy/bootstrap-core-services.sh --prepare-agent
              mkdir /binaries
              cp /official/bin/mihomo /official/bin/xray /official/bin/ssserver /official/bin/sslocal /binaries/
              cp /official/musl/sing-box /binaries/
              QCH_PERMISSION_BIN=/binaries QCH_SERVICE_MANAGER=openrc \
                QCH_LIVE_CORE_PERMISSION_MIGRATION=1 /permission-agent.test \
                -test.run "^TestInstalledOpenRCCorePermissionMigration$" -test.count=1 -test.v
              QCH_PERMISSION_BIN=/binaries QCH_SERVICE_MANAGER=openrc \
                python3 deploy/tests/core-permissions-runtime.py
            '

  # Build immediately. Bake shares compilation vertices across all targets.
  build-images:
    name: Prepare all images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          QCH_ADMIN_TOKEN: ci-admin-token
        run: |
          docker compose config --quiet
          bash deploy/tests/quick-start-compose.sh
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build all images with shared objects
        uses: docker/bake-action@v6
        env:
          VERSION: ${{ github.sha }}
        with:
          files: docker-bake.hcl
          targets: |
            qcontrol-plane
            qagent
            qcontrol-web

  # These exact names are required by main-protection (ruleset 20995958).
  # always() + explicit success validation fails closed for skips/cancellation.
  images:
    name: Build ${{ matrix.target }} image
    if: ${{ always() }}
    needs: [debian, alpine, upgrade-sandbox, mieru-udp, core-permissions, build-images]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        target: [qcontrol-plane, qagent, qcontrol-web]
    steps:
      - uses: actions/checkout@v6
      - name: Require every necessary job to succeed
        env:
          QCH_CI_NEEDS: ${{ toJSON(needs) }}
        run: node .github/scripts/require-ci-success.mjs

  publish:
    name: Publish ${{ matrix.target }} image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'qimaoww/qcontrolhub'
    needs: [images, debian, alpine, upgrade-sandbox, mieru-udp, core-permissions, build-images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: qcontrol-plane
            image: qcontrol-plane
          - target: qagent
            image: qagent
          - target: qcontrol-web
            image: qcontrol-web
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha,scope=qch-v4-${{ matrix.target }}
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/qimaoww/${{ matrix.image }}:latest
            ghcr.io/qimaoww/${{ matrix.image }}:${{ github.sha }}
