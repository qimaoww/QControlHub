name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  debian:
    name: Debian / systemd
    runs-on: ubuntu-latest
    container: golang:1.25-bookworm
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qcontrolhub
        options: >-
          --health-cmd "pg_isready -U postgres -d qcontrolhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      QCH_CHROME_BIN: /usr/bin/chromium
      QCH_TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/qcontrolhub?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Require a schema version bump for schema changes
        env:
          QCH_SCHEMA_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node .github/scripts/check-schema-version.mjs

      - name: Install Debian test dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          # iproute2 provides the ip binary that sing-box dual accounting uses
          # to prove existing policy routing cannot hijack outbound marks.
          # postgresql-client creates one isolated database per test shard.
          apt-get install --no-install-recommends --yes chromium openssl iproute2 postgresql-client

      - name: Run project checks with PostgreSQL
        env:
          QCH_TEST_SHARDS: "4"
        run: |
          bash .github/scripts/run-ci-tests.sh \
            --checks "make browser-checks" \
            --checks "make non-browser-checks"

      - name: Build release binaries
        run: make build VERSION="${{ github.sha }}"

      - name: Validate systemd bootstrap
        shell: bash
        run: |
          fake_bin="$(mktemp -d)"
          trap 'rm -rf "$fake_bin"' EXIT
          printf '%s\n' \
            '#!/bin/sh' \
            'case "$1" in' \
            '  is-active) exit 1 ;;' \
            '  show) printf "%s\n" not-found ;;' \
            '  *) exit 0 ;;' \
            'esac' > "$fake_bin/systemctl"
          chmod 0755 "$fake_bin/systemctl"
          PATH="$fake_bin:$PATH" QCH_SERVICE_MANAGER=systemd sh deploy/bootstrap-core-services.sh
          for service in mihomo xray sing-box shadowsocks-rust; do
            test -f "/etc/systemd/system/qagent-$service.service"
            grep -q '^Description=.* managed by QAgent$' "/etc/systemd/system/qagent-$service.service"
          done
          test -f /etc/systemd/journald@qagent-cores.conf.d/10-qcontrolhub-volatile.conf

  alpine:
    name: Alpine / OpenRC
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qcontrolhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qcontrolhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run project checks on musl/OpenRC
        run: |
          docker run --rm --network host \
            -e QCH_CHROME_BIN=/usr/bin/chromium-browser \
            -e QCH_TEST_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/qcontrolhub?sslmode=disable \
            -e QCH_TEST_SHARDS=4 \
            -e VERSION="${{ github.sha }}" \
            -v "$PWD:/src" -w /src golang:1.25-alpine sh -euxc '
              apk add --no-cache bash chromium coreutils findutils libcap make nftables nodejs openrc openssl postgresql-client
              bash .github/scripts/run-ci-tests.sh \
                --checks "make browser-checks" \
                --checks "make alpine-non-browser-checks" \
                --exclude "/internal/agent$" \
                --extra "make alpine-agent-test"
              make build VERSION="$VERSION"
              sh deploy/tests/existing-core-openrc.sh
              sh -n deploy/remote/install-agent.sh
              sh -n deploy/bootstrap-core-services.sh
              for service in deploy/openrc/*; do sh -n "$service"; done
              QCH_SERVICE_MANAGER=openrc sh deploy/bootstrap-core-services.sh
              for service in qagent-mihomo qagent-xray qagent-sing-box qagent-shadowsocks-rust; do
                test -x "/etc/init.d/$service"
                "/etc/init.d/$service" describe >/dev/null
                rc-update show default | grep -q "$service"
              done
            '

  upgrade-sandbox:
    name: Agent upgrade read-only sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go mod download
      - run: make upgrade-sandbox-test
      - run: make ss-rust-runtime-test

  images:
    name: Build ${{ matrix.target }} image
    needs: [debian, alpine, upgrade-sandbox]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [qcontrol-plane, qagent, qcontrol-web]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Compose configuration
        if: matrix.target == 'qcontrol-plane'
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          QCH_ADMIN_TOKEN: ci-admin-token
        run: |
          docker compose config --quiet
          bash deploy/tests/quick-start-compose.sh

      # The web image embeds SHA256SUMS and its signature. A node that pins
      # QCH_RELEASE_PUBLIC_KEY fetches them from /install-assets/ beside the
      # assets, so a web image built without them is not a usable release image.
      # Build the same inputs here that a release uses: real checksums over the
      # real installer assets, over a key generated for this run only. The
      # throwaway key is fine because this job only proves the image builds; it
      # never publishes one, and a published web image is bound to the version
      # and key of the release that produced it.
      - uses: actions/setup-go@v7
        if: matrix.target == 'qcontrol-web'
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build signed release artifacts for the web image
        if: matrix.target == 'qcontrol-web'
        run: make signing-key release-checksums RELEASE_KEY=release.key VERSION=${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          build-args: VERSION=${{ github.sha }}
          outputs: type=cacheonly
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  publish:
    name: Publish ${{ matrix.target }} image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'qimaoww/qcontrolhub'
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # A published web image has to carry a signature made with the release key:
    # an installer that pins QCH_RELEASE_PUBLIC_KEY verifies SHA256SUMS against
    # it, so a web image signed with a throwaway key fails on every pinned node.
    # Publish it only when the key is configured; the web build step is skipped
    # otherwise instead of pushing an image nobody can verify.
    env:
      RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: qcontrol-plane
            image: qcontrol-plane
          - target: qagent
            image: qagent
          - target: qcontrol-web
            image: qcontrol-web
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # release-checksums needs the toolchain to build the Agent binary and the
      # signing tool before it can write the checksum list.
      - uses: actions/setup-go@v7
        if: env.RELEASE_SIGNING_KEY != ''
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Write release signing key
        if: matrix.target == 'qcontrol-web' && env.RELEASE_SIGNING_KEY != ''
        run: |
          install -m 0600 /dev/null release.key
          printf '%s' "${RELEASE_SIGNING_KEY}" > release.key
      - name: Build signed release artifacts for the web image
        if: matrix.target == 'qcontrol-web' && env.RELEASE_SIGNING_KEY != ''
        run: make release-checksums RELEASE_KEY=release.key VERSION=${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        if: matrix.target != 'qcontrol-web' || env.RELEASE_SIGNING_KEY != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/qimaoww/${{ matrix.image }}:latest
            ghcr.io/qimaoww/${{ matrix.image }}:${{ github.sha }}
